name: Nifty Factor Index Rankings

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs monthly on the 1st
  workflow_dispatch:      # Allow manual runs

jobs:
  factor-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests scipy

      - name: Create Directories
        run: mkdir -p data/reports/rankings

      - name: Run Alpha 50 Scan (Nifty 500)
        run: python run_factor_ranking.py --index "NIFTY 500" --factor alpha --symbols 50

      - name: Run Momentum 30 Scan (Nifty 200)
        run: python run_factor_ranking.py --index "NIFTY 200" --factor momentum --symbols 30

      - name: Run Low Volatility 50 Scan (Nifty 500)
        run: python run_factor_ranking.py --index "NIFTY 500" --factor volatility --symbols 50

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: factor-rankings
          path: data/reports/rankings/*.csv

      - name: Commit Results to Repo (Reports Only)
        run: |
          git config --global user.name "NSE Factor Bot"
          git config --global user.email "bot@factor.nse"
          git add data/reports/rankings/*.csv
          git commit -m "📊 Automated Factor Index Rankings [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
